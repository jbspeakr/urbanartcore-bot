name: Publish
on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/setup-go@v6
        with:
          go-version: '1.25.x' # Change this to whatever you need

      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Quality Check
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./main.go
