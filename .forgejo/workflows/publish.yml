name: Publish
on:
  push:
    branches:
      - main

env:
  REGISTRY: rg.fr-par.scw.cloud/uac-socializer
  IMAGE_NAME: uac-socializer

jobs:
  publish:
    runs-on: codeberg-small
    steps:
      - uses: https://code.forgejo.org/actions/setup-go@v6
        with:
          go-version: '1.25.x' # Change this to whatever you need

      - uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Quality Check
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./main.go

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud
          username: ${{ secrets.SCALEWAY_ACCESS_KEY }}
          password: ${{ secrets.SCALEWAY_SECRET_KEY }}

      - name: Extract metadata
        id: meta
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          VERSION="main-${COMMIT}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64